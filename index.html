<body style="margin:0; background:#0a0b0e; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; padding:20px;">
  <div id="dbErrorBanner" style="display:none; background:#3a1414; color:#ff9a9a; font-family:ui-monospace,monospace; font-size:12px; padding:8px 14px; border-bottom:1px solid #5a1f1f;"></div>
<style>
  :root{
    --bg:#12141a;
    --panel:#1b1e26;
    --panel-2:#20232d;
    --line:#2c303c;
    --text:#e7e9ee;
    --dim:#8b93a5;
    --amber:#ffb020;
    --amber-dim:#7a5518;
    --signal:#4fd1c5;
    --link:#7dc4ff;
    --danger:#ef5a5a;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  #io-app{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    border-radius:10px;
    overflow:hidden;
    border:1px solid var(--line);
    min-height:640px;
    display:flex;
    flex-direction:column;
  }
    .io-header{ background:linear-gradient(180deg,var(--panel-2),var(--panel)); border-bottom:1px solid var(--line); padding:14px 18px; position:relative; }
  .io-header-top{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
  }
    .io-brand{ border-radius:8px; overflow:hidden; flex:1; max-width:100%; } .io-brand img{ display:block; width:100%; height:auto; }
  select, input[type=text]{
    font-family:var(--sans);
    font-size:13px;
  }
  select{
    background:var(--panel-2);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:6px;
    padding:7px 10px;
    min-width:160px;
  }
    .io-status{ font-family:var(--mono); font-size:11px; color:var(--signal); position:absolute; top:18px; right:18px; opacity:0; transition:opacity .3s; }
  .io-status.show{opacity:1;}

  .io-tabs{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:12px;
    flex-wrap:wrap;
  }
  .io-tab{
    display:flex;align-items:center;gap:6px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-bottom:2px solid transparent;
    border-radius:6px 6px 0 0;
    padding:7px 12px;
    cursor:pointer;
    color:var(--dim);
    font-size:13px;
  }
  .io-tab.active{
    color:var(--text);
    border-bottom:2px solid var(--amber);
    background:#242835;
  }

  .io-subtabs{
    display:flex;
    align-items:center;
    gap:6px;
    padding:10px 18px;
    border-bottom:1px solid var(--line);
    background:#181b22;
    flex-wrap:wrap;
  }
  .io-subtabs:empty{ display:none; padding:0; border-bottom:none; }
  .io-subtab{
    background:none;
    border:1px solid var(--line);
    border-radius:14px;
    padding:5px 12px;
    cursor:pointer;
    color:var(--dim);
    font-size:12px;
  }
  .io-subtab.active{
    color:#1a1204;
    background:var(--amber);
    border-color:var(--amber);
    font-weight:600;
  }

  .io-toolbar{
    display:flex;align-items:center;gap:10px;
    padding:12px 18px;
    border-bottom:1px solid var(--line);
    background:var(--panel);
    flex-wrap:wrap;
  }
  .io-search{
    flex:1; min-width:180px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:6px;
    padding:8px 12px;
    color:var(--text);
    font-family:var(--mono);
    font-size:13px;
  }
  .io-search::placeholder{color:var(--dim);}
  .io-count{
    font-family:var(--mono);
    font-size:11px;
    color:var(--dim);
    white-space:nowrap;
  }

  .io-table-wrap{
    flex:1;
    overflow:auto;
    padding:0 18px 18px;
  }
  table.io-table{
    width:100%;
    border-collapse:collapse;
    margin-top:0;
    table-layout:fixed;
  }
  table.io-table thead th{
    position:sticky; top:0;
    background:var(--bg);
    text-align:left;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--dim);
    padding:8px 10px;
    border-bottom:1px solid var(--line);
  }
  table.io-table th.group-end, table.io-table td.group-end{ border-right:4px solid #20232c; }
  table.io-table th.port-col{width:70px;}
  table.io-table th.del-col{width:36px;}
  table.io-table th{ overflow:hidden; }
  .col-resizer{
    position:absolute; right:0; top:0; bottom:0; width:6px;
    cursor:col-resize; user-select:none; touch-action:none;
  }
  .col-resizer:hover, .col-resizer.active{ background:var(--amber-dim); }
  table.io-table td{
    padding:0;
    border-bottom:1px solid #20232c;
    border-right:1px solid #20232c;
    vertical-align:middle;
  }
  table.io-table th{ border-right:1px solid #20232c; }
  table.io-table th:last-child, table.io-table td:last-child{ border-right:none; }
  table.io-table tr:hover td{background:#191c24;}
  .cell-port{
    font-family:var(--mono);
    color:var(--amber);
    padding:9px 10px;
    font-size:13px;
  }
  .cell-edit{ padding:0; }
  .cell-edit input, .cell-edit select{
    width:100%;
    min-width:0;
    background:transparent;
    border:1px solid transparent;
    color:var(--text);
    padding:9px 10px;
    font-size:13px;
    font-family:var(--sans);
    outline:none;
    border-radius:4px;
  }
  .cell-edit select{ appearance:auto; cursor:pointer; }
  .cell-edit input:hover, .cell-edit select:hover{border-color:var(--line);}
  .cell-edit input:focus, .cell-edit select:focus{
    border-color:var(--signal);
    background:#161a22;
  }
  .cell-edit input::placeholder{color:#4a5063; font-style:italic;}
  .cell-note{
    font-size:11px; color:var(--dim); padding:0 10px 6px; font-style:italic;
  }
  .cell-linked{
    display:flex; align-items:center; gap:8px;
    padding:9px 10px;
    color:var(--link);
    font-size:13px;
    background:#152430;
  }
  .cell-linked .chain{ font-size:12px; opacity:.8; }
  .row-del{
    background:none;border:none;color:var(--dim);cursor:pointer;
    font-size:15px; padding:6px; opacity:.5;
  }
  .row-del:hover{color:var(--danger); opacity:1;}

  .io-addrow{
    margin-top:10px;
    background:none;
    border:1px dashed var(--line);
    color:var(--dim);
    border-radius:6px;
    padding:8px 14px;
    cursor:pointer;
    font-size:13px;
    width:100%;
    text-align:center;
  }
  .io-addrow:hover{color:var(--amber); border-color:var(--amber-dim);}

  .io-empty{
    text-align:center;
    color:var(--dim);
    padding:60px 20px;
    font-size:13px;
  }

  @media (max-width:640px){
    .io-header-top{flex-direction:column; align-items:stretch;}
    .io-brand{width:220px;}
    select{min-width:0; flex:1;}
  }
</style>

<div id="io-app">
  <div class="io-header">
    <div class="io-header-top">
        <div class="io-brand"><img src="blackbird-banner.png" alt="Blackbird Tech Info"></div>
      <div class="io-status" id="ioStatus">Saved</div>
    </div>
    <div class="io-tabs" id="ioTabs"></div>
  </div>

  <div class="io-subtabs" id="ioSubTabs"></div>

  <div class="io-toolbar">
    <input class="io-search" id="ioSearch" type="text" placeholder="Search port #, input, or output label&hellip;">
    <div class="io-count" id="ioCount"></div>
  </div>

  <div class="io-table-wrap" id="ioTableWrap"></div>
</div>

        { id: uid('list'), kind: 'switcher', name: 'Switcher (1\u201340)', rows: JSON.parse(JSON.stringify(SEED.switcher)) },
        { id: uid('list'), kind: 'stage-rack-a', name: 'Stage Rack A', rows: JSON.parse(JSON.stringify(SEED.stageRackA)) },
        { id: uid('list'), kind: 'stage-rack-b', name: 'Stage Rack B', rows: JSON.parse(JSON.stringify(SEED.stageRackB)) },
        { id: uid('list'), kind: 'io-panel', name: 'Main I/O Panel (1\u201360)', rows: JSON.parse(JSON.stringify(SEED.ioPanel)) },
        { id: uid('list'), kind: 'patch-panel', name: 'Patch Panel (1\u201380)', rows: JSON.parse(JSON.stringify(SEED.patchPanel)) },
        { id: uid('list'), kind: 'switch-b', name: 'Switch B', rows: JSON.parse(JSON.stringify(SEED.switchB)) },
        { id: uid('list'), kind: 'switch-c', name: 'Switch C', rows: JSON.parse(JSON.stringify(SEED.switchC)) },
        { id: uid('list'), kind: 'switch-d', name: 'Switch D', rows: JSON.parse(JSON.stringify(SEED.switchD)) },
      ]
    };
  }

  // --- Supabase-backed storage ---
  // A single fixed row (id: 'main') in the "shows" table holds everything:
  // data (jsonb: {sourceNames, lists}), updated_at. See schema.sql.

  async function dbGetShow(){
    const { data, error } = await sb.from('shows').select('id,data').eq('id', 'main').maybeSingle();
    if(error){ console.error(error); showDbError(error); return null; }
    if(!data) return null;
    return { id: 'main', sourceNames: (data.data && data.data.sourceNames) || [], lists: (data.data && data.data.lists) || [] };
  }
  async function dbUpsertShow(show){
    const { error } = await sb.from('shows').upsert({
      id: 'main',
      name: 'main',
      data: { sourceNames: show.sourceNames, lists: show.lists },
      updated_at: new Date().toISOString()
    });
    if(error){ console.error(error); showDbError(error); return false; }
    return true;
  }

  function showDbError(error){
    flashStatus('Error');
    const banner = document.getElementById('dbErrorBanner');
    if(banner){
      banner.style.display = 'block';
      banner.textContent = 'Database error: ' + (error && error.message ? error.message : 'check console and your Supabase config.');
    }
  }

  function flashStatus(text){
    els.ioStatus.textContent = text;
    els.ioStatus.classList.add('show');
    clearTimeout(flashStatus._t);
    flashStatus._t = setTimeout(()=> els.ioStatus.classList.remove('show'), 1400);
  }

  async function saveCurrentShow(){
    if(!state.show) return;
    const ok = await dbUpsertShow(state.show);
    if(ok) flashStatus('Saved');
  }

  // Merges a saved show against the current defaultShow() template: adds any new
  // tabs, new rows, and new fields that don't exist yet in the saved data, without
  // ever overwriting a value the user already has saved. Safe to run on every load.
  function migrateShow(show){
    const template = defaultShow();
    let changed = false;

    // Merge sourceNames: union of template + existing, nothing removed.
    const nameSet = new Set([...(show.sourceNames||[]), ...template.sourceNames]);
    const mergedNames = Array.from(nameSet).sort((a,b)=> a.localeCompare(b, undefined, {numeric:true, sensitivity:'base'}));
    if(mergedNames.length !== (show.sourceNames||[]).length){ changed = true; }
    show.sourceNames = mergedNames;

    const existingListsByKind = {};
    show.lists.forEach(l => { existingListsByKind[l.kind] = l; });

    template.lists.forEach(templateList=>{
      const existingList = existingListsByKind[templateList.kind];
      if(!existingList){
        // Whole new tab that didn't exist before -- add it as-is.
        show.lists.push(JSON.parse(JSON.stringify(templateList)));
        changed = true;
        return;
      }
      const existingRowsByPort = {};
      existingList.rows.forEach(r => { existingRowsByPort[r.port] = r; });
      const mergedRows = [];
      templateList.rows.forEach(templateRow=>{
        const existingRow = existingRowsByPort[templateRow.port];
        if(!existingRow){
          // New row (e.g. list grew since this show was saved) -- add it.
          mergedRows.push(JSON.parse(JSON.stringify(templateRow)));
          changed = true;
        } else {
          // Fill in any new fields with template defaults, but real saved values
          // (including ones the user cleared to '') always win.
          const merged = Object.assign({}, templateRow, existingRow);
          if(Object.keys(merged).length !== Object.keys(existingRow).length){ changed = true; }
          mergedRows.push(merged);
        }
      });
      // Preserve any extra rows the user added manually that aren't in the template.
      const templatePorts = new Set(templateList.rows.map(r=>r.port));
      existingList.rows.forEach(r=>{
        if(!templatePorts.has(r.port)) mergedRows.push(r);
      });
      existingList.rows = mergedRows;
    });

    return changed;
  }

  async function loadShow(){
    let show = await dbGetShow();
    if(!show){
      show = defaultShow();
      await dbUpsertShow(show);
    } else {
      if(!show.sourceNames) show.sourceNames = [];
      const changed = migrateShow(show);
      if(changed){ await dbUpsertShow(show); }
    }
    state.show = show;
    state.activeListId = show.lists[0] ? show.lists[0].id : null;
    state.activeGroup = show.lists[0] ? firstGroup(show.lists[0]) : null;
  }


  function renderTabs(){
    els.ioTabs.innerHTML = '';
    state.show.lists.forEach(list=>{
      const tab = document.createElement('div');
      tab.className = 'io-tab' + (list.id === state.activeListId ? ' active' : '');
      tab.title = 'Click to switch \u2014 double-click to rename';
      const nameSpan = document.createElement('span');
      nameSpan.textContent = list.name.replace(/\s*\([^)]*\)\s*$/, '');
      nameSpan.addEventListener('dblclick', async (e)=>{
        e.stopPropagation();
        const newName = prompt('Rename this list:', list.name);
        if(!newName) return;
        list.name = newName.trim() || list.name;
        await saveCurrentShow();
        renderAll();
      });
      tab.appendChild(nameSpan);

      tab.addEventListener('click', ()=>{
        state.activeListId = list.id;
        state.activeGroup = firstGroup(list);
        renderAll();
      });
      els.ioTabs.appendChild(tab);
    });
  }

  function activeList(){
    return state.show.lists.find(l => l.id === state.activeListId) || null;
  }

  function listByKind(kind){
    return state.show.lists.find(l => l.kind === kind) || null;
  }

  function listFieldForPort(kind, port, field, depth){
    depth = depth || 0;
    if(depth > 5) return '';  // guard against an accidental circular link chain
    const source = listByKind(kind);
    if(!source) return null;
    const row = source.rows.find(r => Number(r.port) === Number(port));
    if(!row) return null;
    if(field === 'output'){
      if(row.outputLinked){
        const nextKind = row.outputLinkKind || 'router';
        const nextField = row.outputLinkField || 'input';
        return listFieldForPort(nextKind, row.outputLinkPort, nextField, depth + 1) || '';
      }
      return row.output || '';
    }
    if(field === 'label'){
      if(row.labelLinked){
        const nextKind = row.labelLinkKind || 'router';
        const nextField = row.labelLinkField || 'input';
        return listFieldForPort(nextKind, row.labelLinkPort, nextField, depth + 1) || '';
      }
      return row.label || '';
    }
    if(field === 'label2'){
      if(row.label2Linked){
        const nextKind = row.label2LinkKind || 'router';
        const nextField = row.label2LinkField || 'input';
        return listFieldForPort(nextKind, row.label2LinkPort, nextField, depth + 1) || '';
      }
      return row.label2 || '';
    }
    if(field === 'source'){
      return row.source || '';
    }
    if(row.linked){
      const nextKind = row.linkKind || 'router';
      const nextField = row.linkField || 'input';
      return listFieldForPort(nextKind, row.linkPort, nextField, depth + 1) || '';
    }
    return row.input || '';
  }

  function refLabelForPort(kind, port){
    const source = listByKind(kind);
    if(!source) return 'port ' + port;
    const row = source.rows.find(r => Number(r.port) === Number(port));
    return (row && row.output) ? row.output : 'port ' + port;
  }

  // Reverse lookup: is some other row's bidirectional link pointing AT this exact
  // (kind, port, field)? Used to show the chain icon on the "target" side too,
  // even though the target field itself is just an ordinary editable field.
  // Prefixes that can carry a bidirectional (write-through) link. Any field here can
  // point at another list's field, and the reverse side will show the chain icon too.
  const BIDI_FIELD_PREFIXES = ['label', 'label2', 'source'];

  function findBidiSourceInto(kind, port, field){
    for(const list of state.show.lists){
      for(const row of list.rows){
        for(const prefix of BIDI_FIELD_PREFIXES){
          const bidiKey = prefix + 'Bidi';
          const linkedKey = prefix + 'Linked';
          const kindKey = prefix + 'LinkKind';
          const portKey = prefix + 'LinkPort';
          const fieldKey = prefix + 'LinkField';
          if(row[bidiKey] && row[linkedKey] &&
             row[kindKey] === kind &&
             Number(row[portKey]) === Number(port) &&
             (row[fieldKey] || 'input') === field){
            return { list, row };
          }
        }
      }
    }
    return null;
  }

  function listLabel(kind){
    const l = listByKind(kind);
    if(!l) return kind;
    return l.name.replace(/\s*\([^)]*\)\s*$/, '');
  }

  const GROUP_LABELS = {
    'mux': 'Mux',
    'fiber-ties': 'I/O Panel Fiber Ties',
    'network': 'Network Switch',
    'fiber': 'Fiber',
    'sdi': 'SDI',
    'cat6': 'Network',
    'audio': 'Audio',
  };

  function groupsForList(list){
    if(!list) return [];
    const seen = [];
    list.rows.forEach(r=>{
      if(r.group && !seen.includes(r.group)) seen.push(r.group);
    });
    return seen;
  }

  function firstGroup(list){
    const groups = groupsForList(list);
    return groups.length ? groups[0] : null;
  }

  function renderSubTabs(){
    const list = activeList();
    els.ioSubTabs.innerHTML = '';
    const groups = groupsForList(list);
    if(groups.length < 2) return;
    groups.forEach(g=>{
      const btn = document.createElement('button');
      btn.className = 'io-subtab' + (g === state.activeGroup ? ' active' : '');
      btn.textContent = GROUP_LABELS[g] || g;
      btn.addEventListener('click', ()=>{
        state.activeGroup = g;
        renderTable();
        renderSubTabs();
      });
      els.ioSubTabs.appendChild(btn);
    });
  }

  function filteredRows(list){
    if(!list) return [];
    let rows = list.rows;
    if(state.activeGroup && groupsForList(list).length > 1){
      rows = rows.filter(r => r.group === state.activeGroup);
    }
    const q = state.search.trim().toLowerCase();
    if(!q) return rows;
    return rows.filter(r =>
      String(r.port).includes(q) ||
      (r.input||'').toLowerCase().includes(q) ||
      (r.output||'').toLowerCase().includes(q) ||
      (r.note||'').toLowerCase().includes(q)
    );
  }

  function makeSelect(currentValue, options){
    const select = document.createElement('select');
    const blank = document.createElement('option');
    blank.value = ''; blank.textContent = '\u2014 unassigned \u2014';
    select.appendChild(blank);
    let found = false;
    options.forEach(name=>{
      const opt = document.createElement('option');
      opt.value = name; opt.textContent = name;
      if(name === currentValue){ opt.selected = true; found = true; }
      select.appendChild(opt);
    });
    if(currentValue && !found){
      const opt = document.createElement('option');
      opt.value = currentValue; opt.textContent = currentValue + ' (not in list)';
      opt.selected = true;
      select.appendChild(opt);
    }
    return select;
  }

  function makeDropdown(currentValue){
    const sortedNames = state.show.sourceNames.slice().sort((a,b)=> a.localeCompare(b, undefined, {numeric:true, sensitivity:'base'}));
    return makeSelect(currentValue, sortedNames);
  }

  function makeVlanDropdown(currentValue){
    return makeSelect(currentValue, SEED.vlanOptions);
  }

  function makeNetSwitchDropdown(currentValue){
    return makeSelect(currentValue, SEED.netSwitchOptions);
  }

  function makeRouterSourceDropdown(currentValue){
    const rt = listByKind('router');
    const values = new Set();
    if(rt){
      rt.rows.forEach(r=>{
        const input = listFieldForPort('router', r.port, 'input');
        const label = listFieldForPort('router', r.port, 'label');
        let combined = '';
        if(input && label) combined = input + ': ' + label;
        else if(input) combined = input;
        else if(label) combined = label;
        if(combined) values.add(combined);
      });
    }
    const sorted = Array.from(values).sort((a,b)=> a.localeCompare(b, undefined, {numeric:true, sensitivity:'base'}));
    return makeSelect(currentValue, sorted);
  }

  function makeColumnsResizable(table){
    const ths = table.querySelectorAll('thead th');
    ths.forEach(th=>{
      if(th.classList.contains('del-col')) return;  // no point resizing the tiny delete column
      const resizer = document.createElement('div');
      resizer.className = 'col-resizer';
      th.appendChild(resizer);
      resizer.addEventListener('mousedown', (e)=>{
        e.preventDefault();
        e.stopPropagation();
        const startX = e.pageX;
        const startWidth = th.getBoundingClientRect().width;
        resizer.classList.add('active');
        function onMove(ev){
          const newWidth = Math.max(50, startWidth + (ev.pageX - startX));
          th.style.width = newWidth + 'px';
        }
        function onUp(){
          resizer.classList.remove('active');
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    });
  }

  function renderTable(){
    const list = activeList();
    els.ioTableWrap.innerHTML = '';

    if(!list){
      els.ioTableWrap.innerHTML = '<div class="io-empty">No list selected.</div>';
      els.ioCount.textContent = '';
      return;
    }

    const groupTotal = (state.activeGroup && groupsForList(list).length > 1)
      ? list.rows.filter(r => r.group === state.activeGroup).length
      : list.rows.length;
    const rows = filteredRows(list);
    els.ioCount.textContent = rows.length + ' / ' + groupTotal + ' ports';

    if(!list.rows.length){
      const empty = document.createElement('div');
      empty.className = 'io-empty';
      empty.textContent = 'This list is empty. Use "Add port" below to start building it.';
      els.ioTableWrap.appendChild(empty);
    } else if(!rows.length){
      const empty = document.createElement('div');
      empty.className = 'io-empty';
      empty.textContent = 'No rows match your search.';
      els.ioTableWrap.appendChild(empty);
    } else {
      const table = document.createElement('table');
      table.className = 'io-table';

      const isStageRack = (list.kind === 'stage-rack-a' || list.kind === 'stage-rack-b');
      const stageRackFiberTies = isStageRack && state.activeGroup === 'fiber-ties';
      const stageRackMux = isStageRack && state.activeGroup === 'mux';
      const stageRackNetwork = isStageRack && state.activeGroup === 'network';
      const stageRackLabelGroups = stageRackMux || stageRackFiberTies;
      const isIoPanel = (list.kind === 'io-panel');
      const ioPanelFiberOnly = isIoPanel && state.activeGroup === 'fiber';
      const ioPanelCat6 = isIoPanel && state.activeGroup === 'cat6';
      const ioPanelLabelGroups = isIoPanel && (state.activeGroup === 'fiber' || state.activeGroup === 'sdi');
      const isPatchPanel = (list.kind === 'patch-panel');
      const patchPanelFiberOnly = isPatchPanel && state.activeGroup === 'fiber';
      const patchPanelLabelGroups = isPatchPanel && (state.activeGroup === 'fiber' || state.activeGroup === 'sdi');
      const showInput = true;
      const showOutput = !stageRackFiberTies && !stageRackNetwork && !ioPanelFiberOnly && !ioPanelCat6 && !patchPanelFiberOnly;
      const showLabel = (list.kind === 'router' || list.kind === 'switcher' || stageRackLabelGroups || ioPanelLabelGroups || patchPanelLabelGroups);
      const showLabel2 = (list.kind === 'switcher' || stageRackMux || (ioPanelLabelGroups && !ioPanelFiberOnly) || (patchPanelLabelGroups && !patchPanelFiberOnly));
      const showSourceDest = (list.kind === 'router');
      const showPort = !(list.kind === 'stage-rack-a' || list.kind === 'stage-rack-b' || list.kind === 'io-panel' || list.kind === 'patch-panel' || list.kind === 'switch-b' || list.kind === 'switch-c' || list.kind === 'switch-d') || stageRackNetwork || ioPanelCat6;
      const showDelete = (list.kind !== 'router' && list.kind !== 'switcher' && !isStageRack && !isIoPanel && !isPatchPanel);

      let head = '<thead>';
      head += '<tr>';
      if(showPort) head += '<th class="port-col">Port</th>';
      if(showInput) head += '<th>Input</th>';
      if(showLabel) head += '<th class="group-end">Label</th>';
      if(showOutput) head += '<th>Output</th>';
      if(showSourceDest) head += '<th>Source</th><th>Destination</th>';
      if(showLabel2) head += '<th>Label</th>';
      if(showDelete) head += '<th class="del-col"></th>';
      head += '</tr></thead>';
      table.innerHTML = head;

      const tbody = document.createElement('tbody');

      rows.forEach(row=>{
        const tr = document.createElement('tr');

        if(showPort){
          const tdPort = document.createElement('td');
          tdPort.className = 'cell-port';
          tdPort.textContent = row.port;
          tr.appendChild(tdPort);
        }

        function buildLinkedCell(kind, port, field){
          field = field || 'input';
          const wrap = document.createElement('div');
          wrap.className = 'cell-linked';
          const live = listFieldForPort(kind, port, field);
          const chain = document.createElement('span');
          chain.className = 'chain';
          chain.textContent = '\u26d3';
          wrap.appendChild(chain);
          const val = document.createElement('span');
          val.textContent = (live && live.length) ? live : ('\u2014 unassigned on ' + listLabel(kind) + ' ' + port + ' \u2014');
          wrap.appendChild(val);
          wrap.title = 'Following ' + listLabel(kind) + ' \u2014 ' + refLabelForPort(kind, port) + ' (' + (field === 'output' ? 'Output' : 'Input') + ')';
          return wrap;
        }

        // Bidirectional variant: editing this cell writes straight through to the
        // linked target row instead of to this row -- both sides always show the
        // same live value, whichever one you edit.
        function buildBidiLinkedCell(kind, port, field){
          field = field || 'input';
          const wrap = document.createElement('div');
          wrap.className = 'cell-linked';
          const chain = document.createElement('span');
          chain.className = 'chain';
          chain.textContent = '\u26d3';
          wrap.appendChild(chain);
          const input = document.createElement('input');
          input.type = 'text';
          input.value = listFieldForPort(kind, port, field) || '';
          input.placeholder = '\u2014 unassigned on ' + listLabel(kind) + ' ' + port + ' \u2014';
          input.addEventListener('change', async ()=>{
            const targetList = listByKind(kind);
            if(!targetList){ return; }
            const targetRow = targetList.rows.find(r => Number(r.port) === Number(port));
            if(!targetRow){ return; }
            if(field === 'output'){ targetRow.output = input.value; }
            else if(field === 'label'){ targetRow.label = input.value; }
            else if(field === 'label2'){ targetRow.label2 = input.value; }
            else { targetRow.input = input.value; }
            await saveCurrentShow();
            renderTable();
          });
          wrap.appendChild(input);
          wrap.title = 'Linked both ways with ' + listLabel(kind) + ' \u2014 ' + refLabelForPort(kind, port) + ' (' + (field === 'output' ? 'Output' : 'Input') + ')';
          return wrap;
        }

        if(showInput){
          const td = document.createElement('td');
          td.className = 'cell-edit';

          if(row.linked){
            const kind = row.linkKind || 'router';
            const field = row.linkField || 'input';
            td.appendChild(buildLinkedCell(kind, row.linkPort, field));
          } else if(row.vlanPort){
            const select = makeVlanDropdown(row.input);
            select.addEventListener('change', async ()=>{
              row.input = select.value;
              await saveCurrentShow();
            });
            td.appendChild(select);
          } else if(row.netSwitchPort){
            const select = makeNetSwitchDropdown(row.input);
            select.addEventListener('change', async ()=>{
              row.input = select.value;
              await saveCurrentShow();
            });
            td.appendChild(select);
          } else if(list.kind === 'stage-rack-a' || list.kind === 'stage-rack-b' || list.kind === 'io-panel' || list.kind === 'patch-panel' || list.kind === 'router' || list.kind === 'switcher'){
            const textInput = document.createElement('input');
            textInput.type = 'text';
            textInput.value = row.input || '';
            textInput.placeholder = '\u2014';
            textInput.addEventListener('change', async ()=>{
              row.input = textInput.value;
              await saveCurrentShow();
            });
            td.appendChild(textInput);
          } else {
            const select = makeDropdown(row.input);
            select.addEventListener('change', async ()=>{
              row.input = select.value;
              await saveCurrentShow();
            });
            td.appendChild(select);
          }

          if(row.note){
            const note = document.createElement('div');
            note.className = 'cell-note';
            note.textContent = row.note;
            td.appendChild(note);
          }

          tr.appendChild(td);
        }

        if(showLabel){
          const td = document.createElement('td');
          td.className = 'cell-edit group-end';
          if(row.labelLinked){
            const kind = row.labelLinkKind || 'router';
            const field = row.labelLinkField || 'input';
            td.appendChild(row.labelBidi ? buildBidiLinkedCell(kind, row.labelLinkPort, field) : buildLinkedCell(kind, row.labelLinkPort, field));
          } else {
            const bidiSource = findBidiSourceInto(list.kind, row.port, 'label');
            const input = document.createElement('input');
            input.type = 'text';
            input.value = row.label || '';
            input.placeholder = bidiSource ? ('\u2014 unassigned on ' + listLabel(bidiSource.list.kind) + ' ' + bidiSource.row.port + ' \u2014') : '\u2014';
            input.addEventListener('change', async ()=>{
              row.label = input.value;
              await saveCurrentShow();
            });
            if(bidiSource){
              const wrap = document.createElement('div');
              wrap.className = 'cell-linked';
              const chain = document.createElement('span');
              chain.className = 'chain';
              chain.textContent = '\u26d3';
              wrap.appendChild(chain);
              input.style.background = 'transparent';
              wrap.appendChild(input);
              wrap.title = 'Linked both ways with ' + listLabel(bidiSource.list.kind) + ' \u2014 ' + refLabelForPort(bidiSource.list.kind, bidiSource.row.port);
              td.appendChild(wrap);
            } else {
              td.appendChild(input);
            }
          }
          tr.appendChild(td);
        }

        if(showOutput){
          const td = document.createElement('td');
          td.className = 'cell-edit';

          if(row.outputLinked){
            const kind = row.outputLinkKind || 'router';
            const field = row.outputLinkField || 'input';
            td.appendChild(buildLinkedCell(kind, row.outputLinkPort, field));
          } else {
            const input = document.createElement('input');
            input.type = 'text';
            input.value = row.output || '';
            input.placeholder = '\u2014';
            input.addEventListener('change', async ()=>{
              row.output = input.value;
              await saveCurrentShow();
            });
            td.appendChild(input);
          }

          tr.appendChild(td);
        }

        if(showSourceDest){
          const tdSrc = document.createElement('td');
          tdSrc.className = 'cell-edit';
          if(row.sourceLinked){
            const kind = row.sourceLinkKind || 'io-panel';
            const field = row.sourceLinkField || 'input';
            tdSrc.appendChild(row.sourceBidi ? buildBidiLinkedCell(kind, row.sourceLinkPort, field) : buildLinkedCell(kind, row.sourceLinkPort, field));
          } else {
            const srcSelect = makeRouterSourceDropdown(row.source);
            srcSelect.addEventListener('change', async ()=>{
              row.source = srcSelect.value;
              await saveCurrentShow();
            });
            tdSrc.appendChild(srcSelect);
          }
          tr.appendChild(tdSrc);

          const tdDest = document.createElement('td');
          tdDest.className = 'cell-edit';
          const destInput = document.createElement('input');
          destInput.type = 'text';
          destInput.value = row.destination || '';
          destInput.placeholder = '\u2014';
          destInput.addEventListener('change', async ()=>{
            row.destination = destInput.value;
            await saveCurrentShow();
          });
          tdDest.appendChild(destInput);
          tr.appendChild(tdDest);
        }

        if(showLabel2){
          const td = document.createElement('td');
          td.className = 'cell-edit';
          if(row.label2Linked){
            const kind = row.label2LinkKind || 'router';
            const field = row.label2LinkField || 'input';
            td.appendChild(buildLinkedCell(kind, row.label2LinkPort, field));
          } else {
            const bidiSource = findBidiSourceInto(list.kind, row.port, 'label2');
            const input = document.createElement('input');
            input.type = 'text';
            input.value = row.label2 || '';
            input.placeholder = bidiSource ? ('\u2014 unassigned on ' + listLabel(bidiSource.list.kind) + ' ' + bidiSource.row.port + ' \u2014') : '\u2014';
            input.addEventListener('change', async ()=>{
              row.label2 = input.value;
              await saveCurrentShow();
            });
            if(bidiSource){
              const wrap = document.createElement('div');
              wrap.className = 'cell-linked';
              const chain = document.createElement('span');
              chain.className = 'chain';
              chain.textContent = '\u26d3';
              wrap.appendChild(chain);
              input.style.background = 'transparent';
              wrap.appendChild(input);
              wrap.title = 'Linked both ways with ' + listLabel(bidiSource.list.kind) + ' \u2014 ' + refLabelForPort(bidiSource.list.kind, bidiSource.row.port);
              td.appendChild(wrap);
            } else {
              td.appendChild(input);
            }
          }
          tr.appendChild(td);
        }

        if(showDelete){
          const tdDel = document.createElement('td');
          const delBtn = document.createElement('button');
          delBtn.className = 'row-del';
          delBtn.textContent = '\u00d7';
          delBtn.title = 'Delete this port row';
          delBtn.addEventListener('click', async ()=>{
            list.rows = list.rows.filter(r => r !== row);
            await saveCurrentShow();
            renderAll();
          });
          tdDel.appendChild(delBtn);
          tr.appendChild(tdDel);
        }

        tbody.appendChild(tr);
      });

      table.appendChild(tbody);
      els.ioTableWrap.appendChild(table);
      makeColumnsResizable(table);
    }

    if(list.kind !== 'router' && list.kind !== 'switcher' && list.kind !== 'stage-rack-a' && list.kind !== 'stage-rack-b' && list.kind !== 'io-panel' && list.kind !== 'patch-panel'){
      const addRow = document.createElement('button');
      addRow.className = 'io-addrow';
      addRow.textContent = '+ Add port';
      addRow.addEventListener('click', async ()=>{
        const maxPort = list.rows.reduce((m,r)=> Math.max(m, Number(r.port)||0), 0);
        const newRow = { port: maxPort + 1, input: '', output: '' };
        if(state.activeGroup && groupsForList(list).length > 1){ newRow.group = state.activeGroup; }
        list.rows.push(newRow);
        await saveCurrentShow();
        renderAll();
      });
      els.ioTableWrap.appendChild(addRow);
    }
  }

  function renderAll(){
    renderTabs();
    renderSubTabs();
    renderTable();
  }

  // --- Events ---
  let searchDebounce;
  els.ioSearch.addEventListener('input', ()=>{
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(()=>{ state.search = els.ioSearch.value; renderTable(); }, 80);
  });

  // --- Init ---
  (async function init(){
    if(SUPABASE_URL === "YOUR_SUPABASE_URL" || SUPABASE_ANON_KEY === "YOUR_SUPABASE_ANON_KEY"){
      const banner = document.getElementById('dbErrorBanner');
      banner.style.display = 'block';
      banner.textContent = 'Not configured yet: set SUPABASE_URL and SUPABASE_ANON_KEY at the top of index.html (see README.md).';
      return;
    }
    await loadShow();
    renderAll();
  })();
})();
</script>
