<body style="margin:0; background:#0a0b0e; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; padding:20px;">
  <div id="dbErrorBanner" style="display:none; background:#3a1414; color:#ff9a9a; font-family:ui-monospace,monospace; font-size:12px; padding:8px 14px; border-bottom:1px solid #5a1f1f;"></div>
<style>
  :root{
    --bg:#12141a;
    --panel:#1b1e26;
    --panel-2:#20232d;
    --line:#2c303c;
    --text:#e7e9ee;
    --dim:#8b93a5;
    --amber:#ffb020;
    --amber-dim:#7a5518;
    --signal:#4fd1c5;
    --link:#7dc4ff;
    --danger:#ef5a5a;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  #io-app{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    border-radius:10px;
    overflow:hidden;
    border:1px solid var(--line);
    min-height:640px;
    display:flex;
    flex-direction:column;
  }
    .io-header{ background:linear-gradient(180deg,var(--panel-2),var(--panel)); border-bottom:1px solid var(--line); padding:14px 18px; position:relative; }
  .io-header-top{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
  }
    .io-brand{ border-radius:8px; overflow:hidden; flex:1; max-width:100%; } .io-brand img{ display:block; width:100%; height:auto; }
  .io-led{
    width:8px;height:8px;border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 8px 1px var(--amber);
  }
  select, input[type=text]{
    font-family:var(--sans);
    font-size:13px;
  }
  select{
    background:var(--panel-2);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:6px;
    padding:7px 10px;
    min-width:160px;
  }
    .io-status{ font-family:var(--mono); font-size:11px; color:var(--signal); position:absolute; top:18px; right:18px; opacity:0; transition:opacity .3s; }
  .io-status.show{opacity:1;}

  .io-tabs{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:12px;
    flex-wrap:wrap;
  }
  .io-tab{
    display:flex;align-items:center;gap:6px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-bottom:2px solid transparent;
    border-radius:6px 6px 0 0;
    padding:7px 12px;
    cursor:pointer;
    color:var(--dim);
    font-size:13px;
  }
  .io-tab.active{
    color:var(--text);
    border-bottom:2px solid var(--amber);
    background:#242835;
  }
  .io-tab input{
    background:transparent;border:none;color:inherit;font-size:13px;
    width:auto; max-width:170px; outline:none; font-family:var(--sans);
  }
  .io-tab-close{
    color:var(--dim); font-size:14px; line-height:1; padding:0 2px;
  }
  .io-tab-close:hover{color:var(--danger);}
  .io-tab-add{
    color:var(--dim); border:1px dashed var(--line); border-radius:6px;
    padding:7px 10px; cursor:pointer; font-size:13px;
  }
  .io-tab-add:hover{color:var(--amber); border-color:var(--amber-dim);}

  .io-toolbar{
    display:flex;align-items:center;gap:10px;
    padding:12px 18px;
    border-bottom:1px solid var(--line);
    background:var(--panel);
    flex-wrap:wrap;
  }
  .io-search{
    flex:1; min-width:180px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:6px;
    padding:8px 12px;
    color:var(--text);
    font-family:var(--mono);
    font-size:13px;
  }
  .io-search::placeholder{color:var(--dim);}
  .io-count{
    font-family:var(--mono);
    font-size:11px;
    color:var(--dim);
    white-space:nowrap;
  }

  .io-table-wrap{
    flex:1;
    overflow:auto;
    padding:0 18px 18px;
  }
  table.io-table{
    width:100%;
    border-collapse:collapse;
    margin-top:14px;
  }
  table.io-table thead th{
    position:sticky; top:0;
    background:var(--bg);
    text-align:left;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--dim);
    padding:8px 10px;
    border-bottom:1px solid var(--line);
  }
  table.io-table th.port-col{width:70px;}
  table.io-table th.del-col{width:36px;}
  table.io-table td{
    padding:0;
    border-bottom:1px solid #20232c;
    vertical-align:middle;
  }
  table.io-table tr:hover td{background:#191c24;}
  .cell-port{
    font-family:var(--mono);
    color:var(--amber);
    padding:9px 10px;
    font-size:13px;
  }
  .cell-edit{ padding:0; }
  .cell-edit input, .cell-edit select{
    width:100%;
    background:transparent;
    border:1px solid transparent;
    color:var(--text);
    padding:9px 10px;
    font-size:13px;
    font-family:var(--sans);
    outline:none;
    border-radius:4px;
  }
  .cell-edit select{ appearance:auto; cursor:pointer; }
  .cell-edit input:hover, .cell-edit select:hover{border-color:var(--line);}
  .cell-edit input:focus, .cell-edit select:focus{
    border-color:var(--signal);
    background:#161a22;
  }
  .cell-edit input::placeholder{color:#4a5063; font-style:italic;}
  .cell-note{
    font-size:11px; color:var(--dim); padding:0 10px 6px; font-style:italic;
  }
  .cell-linked{
    display:flex; align-items:center; gap:8px;
    padding:9px 10px;
    color:var(--link);
    font-size:13px;
    background:#152430;
  }
  .cell-linked .chain{ font-size:12px; opacity:.8; }
  .unlink-btn{
    margin-left:auto;
    background:none;border:1px solid #274257;color:var(--link);
    border-radius:4px; font-size:10px; padding:3px 7px; cursor:pointer;
    text-transform:uppercase; letter-spacing:.05em;
  }
  .unlink-btn:hover{background:#1c3446;}
  .relink-btn{
    background:none;border:1px solid var(--line);color:var(--dim);
    border-radius:4px; font-size:10px; padding:3px 7px; cursor:pointer;
    text-transform:uppercase; letter-spacing:.05em; margin-left:6px;
  }
  .relink-btn:hover{color:var(--link); border-color:#274257;}
  .row-del{
    background:none;border:none;color:var(--dim);cursor:pointer;
    font-size:15px; padding:6px; opacity:.5;
  }
  .row-del:hover{color:var(--danger); opacity:1;}

  .io-addrow{
    margin-top:10px;
    background:none;
    border:1px dashed var(--line);
    color:var(--dim);
    border-radius:6px;
    padding:8px 14px;
    cursor:pointer;
    font-size:13px;
    width:100%;
    text-align:center;
  }
  .io-addrow:hover{color:var(--amber); border-color:var(--amber-dim);}

  .io-empty{
    text-align:center;
    color:var(--dim);
    padding:60px 20px;
    font-size:13px;
  }

  @media (max-width:640px){
    .io-header-top{flex-direction:column; align-items:stretch;}
    .io-brand{width:220px;}
    select{min-width:0; flex:1;}
  }
</style>

<div id="io-app">
  <div class="io-header">
    <div class="io-header-top">
        <div class="io-brand"><img src="blackbird-banner.png" alt="Blackbird Tech Info"></div>
      <div class="io-status" id="ioStatus">Saved</div>
    </div>
    <div class="io-tabs" id="ioTabs"></div>

  <div class="io-toolbar">

    <div class="io-count" id="ioCount"></div>
  </div>

  <div class="io-table-wrap" id="ioTableWrap"></div>
</div>

  }

  // --- Supabase-backed storage ---
  // A single fixed row (id: 'main') in the "shows" table holds everything:
  // data (jsonb: {sourceNames, lists}), updated_at. See schema.sql.

  async function dbGetShow(){
    const { data, error } = await sb.from('shows').select('id,data').eq('id', 'main').maybeSingle();
    if(error){ console.error(error); showDbError(error); return null; }
    if(!data) return null;
    return { id: 'main', sourceNames: (data.data && data.data.sourceNames) || [], lists: (data.data && data.data.lists) || [] };
  }
  async function dbUpsertShow(show){
    const { error } = await sb.from('shows').upsert({
      id: 'main',
      name: 'main',
      data: { sourceNames: show.sourceNames, lists: show.lists },
      updated_at: new Date().toISOString()
    });
    if(error){ console.error(error); showDbError(error); return false; }
    return true;
  }

  function showDbError(error){
    flashStatus('Error');
    const banner = document.getElementById('dbErrorBanner');
    if(banner){
      banner.style.display = 'block';
      banner.textContent = 'Database error: ' + (error && error.message ? error.message : 'check console and your Supabase config.');
    }
  }

  function flashStatus(text){
    els.ioStatus.textContent = text;
    els.ioStatus.classList.add('show');
    clearTimeout(flashStatus._t);
    flashStatus._t = setTimeout(()=> els.ioStatus.classList.remove('show'), 1400);
  }

  async function saveCurrentShow(){
    if(!state.show) return;
    const ok = await dbUpsertShow(state.show);
    if(ok) flashStatus('Saved');
  }

  async function loadShow(){
    let show = await dbGetShow();
    if(!show){
      show = defaultShow();
      await dbUpsertShow(show);
    }
    if(!show.sourceNames) show.sourceNames = [];
    state.show = show;
    state.activeListId = show.lists[0] ? show.lists[0].id : null;
  }


  function renderTabs(){
    els.ioTabs.innerHTML = '';
    state.show.lists.forEach(list=>{
      const tab = document.createElement('div');
      tab.className = 'io-tab' + (list.id === state.activeListId ? ' active' : '');
      tab.title = 'Click to switch \u2014 double-click to rename';
      const nameSpan = document.createElement('span');
      nameSpan.textContent = list.name;
      nameSpan.addEventListener('dblclick', async (e)=>{
        e.stopPropagation();
        const newName = prompt('Rename this list:', list.name);
        if(!newName) return;
        list.name = newName.trim() || list.name;
        await saveCurrentShow();
        renderAll();
      });
      tab.appendChild(nameSpan);

      if(state.show.lists.length > 1){
        const close = document.createElement('span');
        close.className = 'io-tab-close';
        close.textContent = '\u00d7';
        close.title = 'Delete this list';
        close.addEventListener('click', async (e)=>{
          e.stopPropagation();
          if(!confirm('Delete list "' + list.name + '"? This cannot be undone.')) return;
          state.show.lists = state.show.lists.filter(l => l.id !== list.id);
          if(state.activeListId === list.id) state.activeListId = state.show.lists[0].id;
          await saveCurrentShow();
          renderAll();
        });
        tab.appendChild(close);
      }

      tab.addEventListener('click', ()=>{ state.activeListId = list.id; renderAll(); });
      els.ioTabs.appendChild(tab);
    });

    const add = document.createElement('div');
    add.className = 'io-tab-add';
    add.textContent = '+ Add list';
    add.title = 'Add a new I/O list (e.g. for another device)';
    add.addEventListener('click', async ()=>{
      const name = prompt('Name for the new list (e.g. "Audio Router 1\u201364"):', 'New List');
      if(!name) return;
      const list = { id: uid('list'), kind: 'custom', name: name.trim(), rows: [] };
      state.show.lists.push(list);
      state.activeListId = list.id;
      await saveCurrentShow();
      renderAll();
    });
    els.ioTabs.appendChild(add);
  }

  function activeList(){
    return state.show.lists.find(l => l.id === state.activeListId) || null;
  }

  function listByKind(kind){
    return state.show.lists.find(l => l.kind === kind) || null;
  }

  function listInputForPort(kind, port){
    const source = listByKind(kind);
    if(!source) return null;
    const row = source.rows.find(r => Number(r.port) === Number(port));
    return row ? (row.input || '') : null;
  }

  function listLabel(kind){
    const l = listByKind(kind);
    return l ? l.name : kind;
  }

  function filteredRows(list){
    if(!list) return [];
    const q = state.search.trim().toLowerCase();
    if(!q) return list.rows;
    return list.rows.filter(r =>
      String(r.port).includes(q) ||
      (r.input||'').toLowerCase().includes(q) ||
      (r.output||'').toLowerCase().includes(q) ||
      (r.note||'').toLowerCase().includes(q)
    );
  }

  function makeDropdown(currentValue){
    const select = document.createElement('select');
    const blank = document.createElement('option');
    blank.value = ''; blank.textContent = '\u2014 unassigned \u2014';
    select.appendChild(blank);
    let found = false;
    const sortedNames = state.show.sourceNames.slice().sort((a,b)=> a.localeCompare(b, undefined, {numeric:true, sensitivity:'base'})); sortedNames.forEach(name=>{
      const opt = document.createElement('option');
      opt.value = name; opt.textContent = name;
      if(name === currentValue){ opt.selected = true; found = true; }
      select.appendChild(opt);
    });
    if(currentValue && !found){
      const opt = document.createElement('option');
      opt.value = currentValue; opt.textContent = currentValue + ' (not in list)';
      opt.selected = true;
      select.appendChild(opt);
    }
    return select;
  }

  function renderTable(){
    const list = activeList();
    els.ioTableWrap.innerHTML = '';

    if(!list){
      els.ioTableWrap.innerHTML = '<div class="io-empty">No list selected. Add one with "+ Add list" above.</div>';
      els.ioCount.textContent = '';
      return;
    }

    const rows = filteredRows(list);
    els.ioCount.textContent = rows.length + ' / ' + list.rows.length + ' ports';

    if(!list.rows.length){
      const empty = document.createElement('div');
      empty.className = 'io-empty';
      empty.textContent = 'This list is empty. Use "Add port" below to start building it.';
      els.ioTableWrap.appendChild(empty);
    } else {
      const table = document.createElement('table');
      table.className = 'io-table';

      const showInput = true;
      const showOutput = true;

      let head = '<thead><tr><th class="port-col">Port</th>';
      if(showInput) head += '<th>Input</th>';
      if(showOutput) head += '<th>Output</th>';
      head += '<th class="del-col"></th></tr></thead>';
      table.innerHTML = head;

      const tbody = document.createElement('tbody');

      rows.forEach(row=>{
        const tr = document.createElement('tr');

        const tdPort = document.createElement('td');
        tdPort.className = 'cell-port';
        tdPort.textContent = row.port;
        tr.appendChild(tdPort);

        function buildLinkedCell(kind, port, onUnlink){
          const wrap = document.createElement('div');
          wrap.className = 'cell-linked';
          const live = listInputForPort(kind, port);
          const chain = document.createElement('span');
          chain.className = 'chain';
          chain.textContent = '\u26d3';
          wrap.appendChild(chain);
          const val = document.createElement('span');
          val.textContent = (live && live.length) ? live : ('\u2014 unassigned on ' + listLabel(kind) + ' \u2014');
          wrap.appendChild(val);
          const unlink = document.createElement('button');
          unlink.className = 'unlink-btn';
          unlink.textContent = 'Unlink';
          unlink.title = 'Stop following ' + listLabel(kind) + ' port ' + port;
          unlink.addEventListener('click', async ()=>{
            await onUnlink(live || '');
          });
          wrap.appendChild(unlink);
          return wrap;
        }

        if(showInput){
          const td = document.createElement('td');
          td.className = 'cell-edit';

          if(row.linked){
            const kind = row.linkKind || 'router';
            td.appendChild(buildLinkedCell(kind, row.linkPort, async (live)=>{
              row.linked = false;
              row.input = live;
              await saveCurrentShow();
              renderAll();
            }));
          } else {
            const select = makeDropdown(row.input);
            select.addEventListener('change', async ()=>{
              row.input = select.value;
              await saveCurrentShow();
            });
            td.appendChild(select);
          }

          if(row.note){
            const note = document.createElement('div');
            note.className = 'cell-note';
            note.textContent = row.note;
            td.appendChild(note);
          }

          tr.appendChild(td);
        }

        if(showOutput){
          const td = document.createElement('td');
          td.className = 'cell-edit';

          if(row.outputLinked){
            const kind = row.outputLinkKind || 'router';
            td.appendChild(buildLinkedCell(kind, row.outputLinkPort, async (live)=>{
              row.outputLinked = false;
              row.output = live;
              await saveCurrentShow();
              renderAll();
            }));
          } else {
            const input = document.createElement('input');
            input.type = 'text';
            input.value = row.output || '';
            input.placeholder = '\u2014';
            input.addEventListener('change', async ()=>{
              row.output = input.value;
              await saveCurrentShow();
            });
            td.appendChild(input);
          }

          tr.appendChild(td);
        }

        const tdDel = document.createElement('td');
        const delBtn = document.createElement('button');
        delBtn.className = 'row-del';
        delBtn.textContent = '\u00d7';
        delBtn.title = 'Delete this port row';
        delBtn.addEventListener('click', async ()=>{
          list.rows = list.rows.filter(r => r !== row);
          await saveCurrentShow();
          renderAll();
        });
        tdDel.appendChild(delBtn);
        tr.appendChild(tdDel);

        tbody.appendChild(tr);
      });

      table.appendChild(tbody);
      els.ioTableWrap.appendChild(table);
    }

    const addRow = document.createElement('button');
    addRow.className = 'io-addrow';
    addRow.textContent = '+ Add port';
    addRow.addEventListener('click', async ()=>{
      const maxPort = list.rows.reduce((m,r)=> Math.max(m, Number(r.port)||0), 0);
      list.rows.push({ port: maxPort + 1, input: '', output: '' });
      await saveCurrentShow();
      renderAll();
    });
    els.ioTableWrap.appendChild(addRow);
  }

  function renderAll(){
    renderTabs();
    renderTable();
  }

  // --- Events ---
  let searchDebounce;
  els.ioSearch.addEventListener('input', ()=>{
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(()=>{ state.search = els.ioSearch.value; renderTable(); }, 80);
  });

  // --- Init ---
  (async function init(){
    if(SUPABASE_URL === "YOUR_SUPABASE_URL" || SUPABASE_ANON_KEY === "YOUR_SUPABASE_ANON_KEY"){
      const banner = document.getElementById('dbErrorBanner');
      banner.style.display = 'block';
      banner.textContent = 'Not configured yet: set SUPABASE_URL and SUPABASE_ANON_KEY at the top of index.html (see README.md).';
      return;
    }
    await loadShow();
    renderAll();
  })();
})();
</script>
